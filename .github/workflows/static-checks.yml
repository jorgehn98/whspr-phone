name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile scripts
        run: python3 -m compileall -q scripts
      - name: Run script tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run static checks
        run: scripts/check-static.py

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Lint, build and verify release APK
        run: scripts/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: whspr-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
